<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Dark Background -->
  <rect width="512" height="512" rx="112" fill="#09090b" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#grad)" stroke-width="8" opacity="0.4" />
  
  <!-- Outer 360 Radar Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#grad)" stroke-width="12" stroke-dasharray="24 12" opacity="0.85" />
  
  <!-- Inner Circuit & Building Emblem -->
  <path d="M 170 340 L 170 200 L 256 130 L 342 200 L 342 340 Z" fill="none" stroke="url(#grad)" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 220 340 L 220 250 L 292 250 L 292 340" fill="none" stroke="#22d3ee" stroke-width="12" stroke-linejoin="round" />
  
  <!-- Pulse Point -->
  <circle cx="256" cy="190" r="18" fill="#10b981" filter="url(#glow)" />
</svg>
